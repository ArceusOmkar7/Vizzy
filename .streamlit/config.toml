[theme]
primaryColor = "#3498db"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8f9fa"
textColor = "#2c3e50"

[server]
headless = true
port = 8501
enableCORS = true
enableXsrfProtection = false
fileWatcherType = "poll"
runOnSave = true

[browser]
gatherUsageStats = false

[global]
developmentMode = false

[logger]
level = "error"
