[project]
name = "vizzy"
version = "0.1.0"
description = "A developer-friendly, Streamlit-powered data visualization assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
    "pandas>=2.3.0",
    "scikit-learn>=1.7.0",
    "seaborn>=0.13.2",
    "streamlit>=1.46.0",
    "scipy>=1.11.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "statsmodels>=0.14.4",
    "plotly>=6.2.0",
]
